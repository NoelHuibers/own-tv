version: 2
updates:
  # Reads and updates pnpm-lock.yaml. ical.js is the only runtime dependency (it ships to
  # the TV); the rest is lint and test tooling.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      dev-minor-and-patch:
        dependency-type: development
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
